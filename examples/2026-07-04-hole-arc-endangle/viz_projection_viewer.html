<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Projection Viewer</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2332;
    --border: #2d3a4f;
    --text: #e7ecf3;
    --muted: #8b9bb4;
    --accent: #3d8bfd;
    --cont: #5eead4;
    --dash: #fbbf24;
    --hid: #64748b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  header .case { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace;
    max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs, .src-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab, .src-tab {
    appearance: none; border: 1px solid var(--border); background: transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
  }
  .tab:hover, .src-tab:hover { color: var(--text); border-color: #44566f; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .src-tab.active { background: #0d9488; border-color: #0d9488; color: #fff; font-weight: 600; }
  .src-tab:disabled { opacity: 0.35; cursor: not-allowed; }
  .src-label { font-size: 11px; color: var(--muted); margin-right: 4px; align-self: center; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-left: auto; font-size: 12px; color: var(--muted); }
  .controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .controls input[type="checkbox"] { accent-color: var(--accent); }
  .controls button {
    appearance: none; border: 1px solid var(--border); background: #243044; color: var(--text);
    padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  .controls button:hover { border-color: var(--accent); }
  #meta { font-size: 12px; color: var(--muted); }
  #stage-wrap { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  #stage { width: 100%; height: 100%; display: block; cursor: grab; background:
    radial-gradient(ellipse at center, #152033 0%, var(--bg) 70%); }
  #stage.dragging { cursor: grabbing; }
  .legend {
    position: absolute; left: 12px; bottom: 12px; background: rgba(26,35,50,0.92);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 11px;
    display: flex; gap: 14px; pointer-events: none;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 22px; height: 0; border-top: 2px solid; }
  .swatch.cont { border-color: var(--cont); }
  .swatch.dash { border-color: var(--dash); border-top-style: dashed; }
  .hint { position: absolute; right: 12px; bottom: 12px; font-size: 11px; color: var(--muted);
    background: rgba(26,35,50,0.85); padding: 6px 10px; border-radius: 6px; pointer-events: none; }
</style>
</head>

    <div class="legend">

    </div>

  </div>
</div>

function sources() { return DATA.sources || {}; }

function viewNames() {

  if (!v) return;
  const b = boundsOf(v.segs);
  const bw = Math.max(1e-6, b.maxX - b.minX);
  const bh = Math.max(1e-6, b.maxY - b.minY);
  const pad = 40;
  scale = Math.min((w - pad * 2) / bw, (h - pad * 2) / bh);
  tx = w / 2 - scale * (b.minX + b.maxX) / 2;
  // flip Y: CAD Y up → canvas Y down
  ty = h / 2 + scale * (b.minY + b.maxY) / 2;
}

function worldToScreen(x, y) {
  return [tx + scale * x, ty - scale * y];
}

function paint() {
  const wrap = document.getElementById('stage-wrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  ctx.clearRect(0, 0, w, h);

  // grid
  ctx.save();
  ctx.strokeStyle = 'rgba(45,58,79,0.45)';
  ctx.lineWidth = 1;
  const step = niceStep(80 / scale);
  const x0 = (-tx) / scale, x1 = (w - tx) / scale;
  const yTop = ty / scale, yBot = (ty - h) / scale;
  const gx0 = Math.floor(x0 / step) * step;
  const gy0 = Math.floor(yBot / step) * step;
  ctx.beginPath();
  for (let x = gx0; x <= x1; x += step) {
    const a = worldToScreen(x, yBot), b = worldToScreen(x, yTop);
    ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
  }
  for (let y = gy0; y <= yTop; y += step) {
    const a = worldToScreen(x0, y), b = worldToScreen(x1, y);
    ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
  }
  ctx.stroke();
  ctx.restore();

  const v = views()[viewKey];
  if (!v) {
    metaEl.textContent = (currentSource().label || sourceKey) + ' · 无视图';
    return;
  }
  let nCont = 0, nDash = 0, drawn = 0;
  for (const seg of v.segs) {
    const dash = isDashed(seg.t);
    if (dash) nDash++; else nCont++;
    if (dash && !showDash.checked) continue;
    if (!dash && !showCont.checked) continue;
    const pts = seg.p;
    if (!pts || pts.length < 2) continue;
    ctx.beginPath();
    const p0 = worldToScreen(pts[0][0], pts[0][1]);
    ctx.moveTo(p0[0], p0[1]);
    for (let i = 1; i < pts.length; i++) {
      const p = worldToScreen(pts[i][0], pts[i][1]);
      ctx.lineTo(p[0], p[1]);
    }
    ctx.lineWidth = dash ? 1.1 : 1.35;
    ctx.strokeStyle = dash ? '#fbbf24' : '#5eead4';
    ctx.setLineDash(dash ? [6, 4] : []);
    ctx.globalAlpha = dash ? 0.85 : 1;
    ctx.stroke();
    drawn++;
  }
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  const edgeExtra = (v.edgeCount != null) ? (' · rawEdges=' + v.edgeCount) : '';
  metaEl.textContent = (currentSource().label || sourceKey) + ' · ' + viewKey +
    ' · segs=' + v.n + ' (C ' + nCont + ' / D ' + nDash + ') · drawn=' + drawn +
    edgeExtra + ' · scale=' + scale.toFixed(2);
}

function niceStep(raw) {
  const pow = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1e-9))));
  const n = raw / pow;
  let m = 1;
  if (n > 5) m = 10;
  else if (n > 2) m = 5;
  else if (n > 1) m = 2;
  return m * pow;
}

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const wx = (mx - tx) / scale;
  const wy = (ty - my) / scale;
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  scale *= factor;
  tx = mx - wx * scale;
  ty = my + wy * scale;
  paint();
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add('dragging');
});
window.addEventListener('mouseup', () => {
  dragging = false; canvas.classList.remove('dragging');
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  tx += e.clientX - lastX;
  ty += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  paint();
});
canvas.addEventListener('dblclick', () => { fitView(); paint(); });
document.getElementById('fit').onclick = () => { fitView(); paint(); };
showCont.onchange = paint;
showDash.onchange = paint;
window.addEventListener('resize', () => { resize(); });

buildSrcTabs();
buildViewTabs();
resize();
fitView();
paint();
</script>
</body>
</html>
